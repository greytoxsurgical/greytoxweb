<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Catalogs — GreyTox Surgical Instruments</title>
<link rel="icon" href="assets/logo/logo.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="headerRoot"></div>

<section class="section">
  <div class="container">
    <div class="sec-head mt-0">
      <span class="eyebrow">Downloads</span>
      <h2>Product Catalogs</h2>
      <p>Download our latest PDF catalogs for your reference or distribution.</p>
    </div>
    <div class="doc-grid" id="catalogList">
      <div class="skeleton" style="height:320px"></div>
      <div class="skeleton" style="height:320px"></div>
      <div class="skeleton" style="height:320px"></div>
    </div>
  </div>
</section>

<div id="footerRoot"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/utils.js"></script>
<script src="js/components.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

(async function () {
  await initGreyToxPage("catalogs.html");
  const root = document.getElementById("catalogList");
  try {
    const snap = await db.collection("catalogs").orderBy("createdAt", "desc").get();
    if (snap.empty) {
      root.innerHTML = `<div class="empty-state" style="grid-column:1/-1">Catalogs jald hi upload ki jayengi.</div>`;
      return;
    }
    root.innerHTML = snap.docs.map((d) => {
      const c = d.data();
      return `
      <div class="doc-card">
        <div class="doc-card__thumb" id="thumb-${d.id}">
          <div class="loader"></div>
        </div>
        <div class="doc-card__body">
          <h4>${escapeHtml(c.title)}</h4>
          <span>PDF · ${timeAgo(c.createdAt)}</span>
          <a href="${c.fileUrl}" target="_blank" rel="noopener" class="btn btn-primary btn-sm btn-block" style="margin-top:12px">⬇ Download PDF</a>
        </div>
      </div>`;
    }).join("");

    snap.docs.forEach((d) => renderPdfCover(d.id, d.data().fileUrl));
  } catch (e) {
    root.innerHTML = `<div class="empty-state" style="grid-column:1/-1">Load error.</div>`;
  }
})();

async function renderPdfCover(id, url) {
  const box = document.getElementById(`thumb-${id}`);
  if (!box) return;
  try {
    const pdf = await pdfjsLib.getDocument({ url, withCredentials: false }).promise;
    const page = await pdf.getPage(1);
    const viewport = page.getViewport({ scale: 1 });
    const scale = box.clientWidth ? (box.clientWidth * 2) / viewport.width : 1.5;
    const scaledViewport = page.getViewport({ scale });
    const canvas = document.createElement("canvas");
    canvas.width = scaledViewport.width;
    canvas.height = scaledViewport.height;
    const ctx = canvas.getContext("2d");
    await page.render({ canvasContext: ctx, viewport: scaledViewport }).promise;
    box.innerHTML = "";
    box.appendChild(canvas);
  } catch (e) {
    box.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:40px">📄</div>`;
  }
}
</script>
</body>
</html>
