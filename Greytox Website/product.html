<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Product — GreyTox Surgical Instruments</title>
<link rel="icon" href="assets/logo/logo.png" />
<link rel="stylesheet" href="css/style.css" />
<style>
  .pd-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:44px}
  @media (max-width:860px){.pd-grid{grid-template-columns:1fr}}
  .pd-main-img{aspect-ratio:1/1;border-radius:var(--radius);overflow:hidden;background:var(--c-silver-100);border:1px solid var(--c-silver-200)}
  .pd-main-img img{width:100%;height:100%;object-fit:cover}
  .pd-thumbs{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  .pd-thumbs img{width:70px;height:70px;object-fit:cover;border-radius:8px;border:2px solid transparent;cursor:pointer}
  .pd-thumbs img.active{border-color:var(--c-green-700)}
</style>
</head>
<body>

<div id="headerRoot"></div>

<section class="section">
  <div class="container" id="productDetail">
    <div class="skeleton" style="height:60vh"></div>
  </div>
</section>

<div id="footerRoot"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/utils.js"></script>
<script src="js/components.js"></script>
<script src="js/main.js"></script>
<script src="js/product-detail.js"></script>
</body>
</html>
