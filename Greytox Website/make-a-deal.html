<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Make a Deal — GreyTox Surgical Instruments</title>
<link rel="icon" href="assets/logo/logo.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="headerRoot"></div>

<section class="section">
  <div class="container">
    <div class="sec-head mt-0">
      <span class="eyebrow">Bulk &amp; Custom Orders</span>
      <h2>Make a Deal</h2>
      <p>Add the products, quantities and delivery location you need — send your inquiry directly to our sales team.</p>
    </div>

    <div class="form-card" style="max-width:820px">
      <form id="dealForm">
        <div class="form-grid">
          <div class="field"><label>Your Name</label><input type="text" name="name" required /></div>
          <div class="field"><label>Company (optional)</label><input type="text" name="company" /></div>
        </div>
        <div class="form-grid">
          <div class="field"><label>Email</label><input type="email" name="email" required /></div>
          <div class="field"><label>Phone / WhatsApp</label><input type="text" name="phone" required /></div>
        </div>

        <h3 style="margin-top:26px;font-size:18px">Products Required</h3>
        <div id="dealRows"></div>
        <button type="button" class="btn btn-outline btn-sm" id="addRowBtn">+ Add Another Product</button>

        <div class="field" style="margin-top:22px">
          <label>Receiving Location (city / country / full address)</label>
          <textarea name="location" required placeholder="e.g. Karachi, Pakistan — or full shipping address"></textarea>
        </div>
        <div class="field">
          <label>Additional Notes (optional)</label>
          <textarea name="notes" placeholder="Custom branding text, delivery deadline, etc."></textarea>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="dealSubmit">Send Query</button>
      </form>
    </div>
  </div>
</section>

<div id="footerRoot"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/utils.js"></script>
<script src="js/components.js"></script>
<script src="js/deal.js"></script>
</body>
</html>
