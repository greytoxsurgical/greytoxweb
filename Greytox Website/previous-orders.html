<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Previous Orders — GreyTox Surgical Instruments</title>
<link rel="icon" href="assets/logo/logo.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="headerRoot"></div>

<section class="section">
  <div class="container">
    <div class="sec-head mt-0">
      <span class="eyebrow">Track Record</span>
      <h2>Previous Orders</h2>
      <p>A snapshot of recent export shipments fulfilled by GreyTox around the world.</p>
    </div>
    <div id="ordersList">
      <div class="skeleton" style="height:90px;margin-bottom:12px"></div>
      <div class="skeleton" style="height:90px;margin-bottom:12px"></div>
      <div class="skeleton" style="height:90px"></div>
    </div>
  </div>
</section>

<div id="footerRoot"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/utils.js"></script>
<script src="js/components.js"></script>
<script>
(async function () {
  await initGreyToxPage("previous-orders.html");
  const root = document.getElementById("ordersList");
  try {
    const snap = await db.collection("previousOrders").orderBy("createdAt", "desc").get();
    if (snap.empty) {
      root.innerHTML = `<div class="empty-state">Koi order abhi record nahi hua.</div>`;
      return;
    }
    root.innerHTML = snap.docs.map((d) => {
      const o = d.data();
      return `
      <div class="order-row">
        ${o.imageUrl ? `<img src="${o.imageUrl}" alt="${escapeHtml(o.productName)}" />` : `<div style="width:64px;height:64px;border-radius:8px;background:var(--c-silver-100)"></div>`}
        <div class="meta">
          <b>${escapeHtml(o.productName)}</b>
          <span>${escapeHtml(o.quantity || "")} shipped to ${escapeHtml(o.country || "")}</span>
        </div>
        <span class="tag-status">${escapeHtml(o.status || "Delivered")}</span>
        <span class="muted" style="font-size:12.5px">${timeAgo(o.createdAt)}</span>
      </div>`;
    }).join("");
  } catch (e) {
    root.innerHTML = `<div class="empty-state">Load error.</div>`;
  }
})();
</script>
</body>
</html>
