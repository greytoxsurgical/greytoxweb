<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Panel — GreyTox</title>
<meta name="robots" content="noindex,nofollow" />
<link rel="icon" href="assets/logo/logo.png" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/admin.css" />
<link href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css" rel="stylesheet" />
</head>
<body>

<!-- Password gate (shown if session not authed) -->
<div class="admin-gate" id="adminGate">
  <div class="box">
    <img src="assets/logo/logo.png" alt="GreyTox" />
    <h3>Admin Login</h3>
    <p class="hint">Password enter karen jari rakhne ke liye.</p>
    <form id="gateForm">
      <div class="field"><input type="password" id="gatePass" placeholder="Password" required autofocus /></div>
      <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>
  </div>
</div>

<!-- Admin dashboard (shown after auth) -->
<div class="admin-shell" id="adminShell" style="display:none">
  <aside class="admin-sidebar">
    <div class="admin-sidebar__logo"><img src="assets/logo/logo.png" alt="GreyTox" /></div>
    <button class="admin-nav-btn active" data-tab="dashboard">📊 Dashboard</button>
    <button class="admin-nav-btn" data-tab="products">🧰 Products</button>
    <button class="admin-nav-btn" data-tab="categories">🗂 Categories</button>
    <button class="admin-nav-btn" data-tab="certificates">📜 Certificates</button>
    <button class="admin-nav-btn" data-tab="about">🏢 About Us</button>
    <button class="admin-nav-btn" data-tab="catalogs">📄 Catalogs</button>
    <button class="admin-nav-btn" data-tab="feedbacks">⭐ Feedbacks</button>
    <button class="admin-nav-btn" data-tab="orders">📦 Previous Orders</button>
    <button class="admin-nav-btn" data-tab="deals">🤝 Deal Inquiries</button>
    <button class="admin-nav-btn" data-tab="messages">✉ Contact Messages</button>
    <button class="admin-nav-btn" data-tab="settings">⚙ Site Settings</button>
    <button class="admin-nav-btn" data-tab="theme">🎨 Theme Colors</button>
    <button class="admin-nav-btn" id="logoutBtn" style="margin-top:20px;color:#ff9a8f">⏻ Logout</button>
  </aside>
  <main class="admin-main">
    <div class="admin-topbar">
      <h2 id="tabTitle">Dashboard</h2>
      <a href="index.html" target="_blank" class="btn btn-outline btn-sm">View Site ↗</a>
    </div>
    <div id="tabContent"><div class="skeleton" style="height:300px"></div></div>
  </main>
</div>

<!-- Slide-in drawer for add/edit forms -->
<div class="admin-drawer-overlay" id="drawerOverlay">
  <div class="admin-drawer" id="drawerBody"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
